name: Android APK Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate API base URL
        env:
          API_BASE_URL: ${{ vars.WISHWALLET_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Set the WISHWALLET_API_BASE_URL repository variable to the deployed API URL."
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::WISHWALLET_API_BASE_URL must use HTTPS."; exit 1 ;;
          esac
          case "$API_BASE_URL" in
            */) echo "::error::WISHWALLET_API_BASE_URL must not end with a slash."; exit 1 ;;
          esac

      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.WISHWALLET_API_BASE_URL }}
        run: flutter build apk --release --dart-define="API_BASE_URL=$API_BASE_URL"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: WishWallet ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
