services:
  - type: web
    name: wishwallet-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wishwallet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: wishwallet-db
    databaseName: wishwallet
    user: wishwallet
    plan: free
    region: oregon
